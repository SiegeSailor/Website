$defs:
  organization:
    type: object
    properties:
      name:
        type: string
      acronym:
        type: string
      units:
        description: >-
          The units of the organization ordered by descending hierarchy.
        type: array
        items:
          type: string
  dates:
    type: object
    properties:
      start:
        type: string
      end:
        type: string
