# The home page hero, the /about header, and the generated README. Never
# rendered in the resume document — the document has its own name and contact
# block. External links live in media.yaml.
consumers:
  - /
  - /about
  - readme

profile:
  picture: /images/Jin-Yu-Zhang.jpg
  headlines:
    - "Full-Stack Development"
    - "DevOps"
    - "Cloud-Based Web Microservices"
  status:
    location: "NYC Metropolitan Area"
    position: "Senior Software Engineer"
  # Home page (jinyu-zhang.com) hero: `tagline` completes the "<position> at
  # <company> — " headline; `intro` is the paragraph beneath it.
  tagline: "DevOps & full-stack, from cloud microservices to FDA-regulated medical devices."
  intro: >-
    I build scalable, maintainable systems and write up what I learn along the
    way — CI/CD, containers, embedded WebKit, and the occasional debugging saga.
