schemaVersion: "2.0.0"

containerRunOptions:
  privileged: false
  user: "user"

commandTests:
  - name: "Check node version"
    command: "node"
    args: ["--version"]
    expectedOutput: [".*25.2.1"]
    exitCode: 0
  - name: "Check the default user"
    command: "whoami"
    args: []
    expectedOutput: ["user"]
    exitCode: 0

  - name: "Check $LOCAL_COMMIT_SHORT"
    command: "bash"
    args: ["-c", "echo $LOCAL_COMMIT_SHORT | wc -m"]
    expectedOutput: ["8"]
  - name: "Check $LOCAL_GROUP_ID"
    command: "echo"
    args: ["$LOCAL_GROUP_ID"]
    expectedOutput: [".*"]
  - name: "Check $LOCAL_USER_ID"
    command: "echo"
    args: ["$LOCAL_USER_ID"]
    expectedOutput: [".*"]

fileExistenceTests:
  - name: "Check the Next.js standalone build"
    path: "/app/client/.next/static/"
    shouldExist: true
    permissions: "drwxr-xr-x"
  - name: "Check the Next.js start script"
    path: "/app/client/server.js"
    shouldExist: true
    permissions: "-rw-r--r--"

metadataTest:
  exposedPorts: ["3000"]
  user: "user"
  workdir: "/app/client/"
