# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Verify
description: Run every quality gate — Prettier, ESLint, tsc, and hadolint on the Dockerfile.

# Composite steps run in the calling job, so this needs no runner of its own and
# reuses the caller's node_modules: run setup-workspace before it. Removing this
# step must never break a later one, which is why it installs nothing itself.
runs:
  using: composite
  steps:
    - name: Format check
      shell: bash
      run: npm run format:check

    - name: Lint
      shell: bash
      run: npm run lint

    - name: Typecheck
      shell: bash
      run: npm run typecheck

    - name: Setup Hadolint
      uses: ./.github/actions/setup-hadolint

    - name: Lint Dockerfile
      shell: bash
      run: bash scripts/hadolint.sh
