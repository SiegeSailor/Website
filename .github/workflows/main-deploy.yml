# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "main: Deploy AWS static website"
run-name: "main: Deploy ${{ github.ref_name }}@${{ github.sha }} by @${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main-deploy.yml
      - source/**
      - package-lock.json
      - infrastructure/**
  workflow_dispatch:

concurrency:
  group: main-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    environment: production
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        env:
          COMMIT_SHORT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Generate resume documents
        run: bash scripts/docker-copy.sh "source/website/export/documents"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Terraform Initialize
        working-directory: infrastructure
        run: terraform init

      - name: Terraform Format
        working-directory: infrastructure
        run: terraform fmt -check

      - name: Terraform Lint
        working-directory: infrastructure
        run: tflint --init && tflint

      - name: Terraform Validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure
        run: terraform apply -auto-approve tfplan

      - name: Deploy static site
        working-directory: infrastructure
        run: |
          bucket="$(terraform output -raw site_bucket_name)"
          distribution="$(terraform output -raw cloudfront_distribution_id)"
          aws s3 sync ../source/website/export "s3://${bucket}" --delete --exclude "*.DS_Store"
          aws cloudfront create-invalidation --distribution-id "${distribution}" --paths "/*"
          {
            echo "| Target | Value |"
            echo "| --- | --- |"
            echo "| Bucket | \`${bucket}\` |"
            echo "| Distribution | \`${distribution}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
