# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - docker-context/**
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/ci.yml
      - docker-context/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Lint, Typecheck
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: docker-context

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: docker-context/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
