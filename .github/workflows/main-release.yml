# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "main: Publish semantic release"
run-name: "main: Publish semantic release from ${{ github.sha }} by @${{ github.actor }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    name: Version and Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # semantic-release resolves the version mid-run, too late for `run-name`,
      # so the run reports it in the summary instead.
      - name: Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx semantic-release 2>&1 | tee "${RUNNER_TEMP}/release.log"
          if grep -q "Published release" "${RUNNER_TEMP}/release.log"; then
            echo "released v$(node -p "require('./package.json').version") from ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "no release cut from ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resume-${{ github.sha }}
          path: source/tooling/export/resume/
          if-no-files-found: ignore
