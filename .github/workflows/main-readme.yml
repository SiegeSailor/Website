# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "main: Sync README to SiegeSailor/SiegeSailor"
run-name: "main: Sync README from ${{ github.sha }} by @${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main-readme.yml
      - source/content/**
      - source/tooling/**
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: main-readme
  cancel-in-progress: false

jobs:
  sync:
    name: Build and Sync
    environment: production
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # The README needs neither LibreOffice nor the pinned fonts, so it is
      # built on the runner; only the resume documents go through Docker.
      - name: Resolve project versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build:versions

      - name: Build README
        run: npm run build:readme

      - name: Sync README
        env:
          GH_TOKEN: ${{ secrets.SIEGESAILOR_PAT }}
        run: |
          version="$(node -p "require('./package.json').version")"
          workdir="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/SiegeSailor/SiegeSailor.git" "${workdir}"
          cp source/tooling/export/SiegeSailor-README.md "${workdir}/README.md"
          cd "${workdir}"
          if [ -z "$(git status --porcelain)" ]; then
            echo "README already up to date" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: sync the README from v${version} [skip ci]"
          git push
          echo "README synced from v${version}" >> "${GITHUB_STEP_SUMMARY}"
