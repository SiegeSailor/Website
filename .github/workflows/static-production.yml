name: Static Production

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/static-production.yml
      - docker-context/**
      - infrastructure/static-production/**
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Static Environment
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_branch: main
      TF_VAR_github_oauth_token: ${{ secrets.GITHUB_TOKEN }}
      TF_VAR_github_repository: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: docker-context/package-lock.json

      - name: Build static site
        working-directory: docker-context
        run: |
          npm ci
          npm run build:static

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Initialize
        working-directory: infrastructure/static-production
        run: terraform init

      - name: Terraform Format
        working-directory: infrastructure/static-production
        run: terraform fmt -check

      - name: Terraform Lint
        working-directory: infrastructure/static-production
        run: tflint --init && tflint

      - name: Terraform Validate
        working-directory: infrastructure/static-production
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/static-production
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/static-production
        run: terraform apply -auto-approve tfplan
